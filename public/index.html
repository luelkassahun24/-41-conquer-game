<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ወርቅ 41 - Conquer Card Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1d13; color: #fff; height: 100vh; overflow: hidden; }
        
        .auth-container { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #183324; padding: 25px; border-radius: 12px; border: 2px solid #ffd700; width: 100%; max-width: 350px; text-align: center; }
        .auth-box h2 { color: #ffd700; margin-bottom: 15px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: #0b1d13; border: 1px solid #2d5a3f; border-radius: 6px; color: #fff; font-size: 16px; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 10px; background: #ffd700; border: none; border-radius: 6px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .game-screen { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; position: relative; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #12281c; padding: 10px 15px; border-radius: 8px; border: 1px solid #2d5a3f; }
        .balance-box { color: #ffd700; font-weight: bold; font-size: 18px; }
        
        .hand-container { position: relative; height: 180px; width: 100%; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 20px; }
        .card { width: 65px; height: 95px; background: #fff; color: #000; border-radius: 6px; position: absolute; bottom: 0; transform-origin: bottom center; box-shadow: -2px 2px 8px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 14px; cursor: pointer; border: 1px solid #ccc; }
        .card.red { color: #d00; }
        .card.selected { transform: translateY(-20px) !important; border: 2px solid #ffd700; }

        .action-bars { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
        
        .timer-banner { background: #ffc107; color: #000; text-align: center; padding: 5px; font-weight: bold; font-size: 14px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <!-- Login/Register Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>ወርቅ 41 (Werq 41)</h2>
            <input type="text" id="authName" placeholder="ሙሉ ስም">
            <input type="tel" id="authPhone" placeholder="ስልክ ቁጥር (09...)">
            <input type="password" id="authPass" placeholder="የይለፍ ቃል">
            <button onclick="register()">3 ቀን ነፃ ተመዝገብ (Register)</button>
            <button onclick="login()" style="background: transparent; color: #ffd700; border: 1px solid #ffd700; margin-top: 5px;">ይግቡ (Login)</button>
        </div>
    </div>

    <!-- Main Game Interface -->
    <div id="gameScreen" class="game-screen" style="display: none;">
        <div class="header-bar">
            <div>👤 <span id="userDisplayName">-</span></div>
            <div class="balance-box">💰 <span id="userBalance">0</span> ETB</div>
        </div>

        <div id="sortingBanner" class="timer-banner">⏱️ ካርታዎችን የማደራጃ ጊዜ፡ <span id="timerSec">20</span> ሰከንድ</div>

        <div style="text-align: center; margin-top: 40px;">
            <p style="color: #aaa; font-size: 14px;">መደብ (Deck)</p>
            <button class="btn btn-primary" onclick="startAdminGame()" style="margin-top: 10px;">🎮 ጨዋታ ጀምር (Stake: 50 ETB)</button>
        </div>

        <div class="action-bars">
            <button class="btn btn-success" onclick="claimWin()">🏆 SHOW (አሸንፌአለሁ)</button>
            <button class="btn btn-primary" onclick="openDepositModal()">💳 ብር አስገባ</button>
            <button class="btn btn-danger" onclick="openWithdrawModal()">💸 ብር አውጣ</button>
        </div>

        <div class="hand-container" id="playerHand"></div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;

        function register() {
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, phone, password })
            })
            .then(r => r.json())
            .then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function login() {
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            })
            .then(r => r.json())
            .then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function initDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('userDisplayName').innerText = currentUser.name;
            document.getElementById('userBalance').innerText = currentUser.balance;
        }

        function startAdminGame() {
            if(!currentUser) return;
            socket.emit('startAdminGame', { phone: currentUser.phone, stake: 50 });
        }

        socket.on('adminGameStarted', (data) => {
            renderHand(data.playerHand);
        });

        function renderHand(cards) {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = cards.length;
            
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.className = `card ${isRed ? 'red' : ''}`;
                
                const angle = (index - (total - 1) / 2) * 4;
                const translateY = Math.abs(index - (total - 1) / 2) * 3;
                cardEl.style.transform = `rotate(${angle}deg) translateY(${translateY}px)`;

                cardEl.innerHTML = `<div>${card.value}</div><div style="font-size:20px; text-align:center;">${card.suit}</div><div style="text-align:right;">${card.value}</div>`;
                cardEl.onclick = () => cardEl.classList.toggle('selected');

                container.appendChild(cardEl);
            });
        }

        function claimWin() {
            if(!currentUser) return;
            socket.emit('claimAdminWin', { phone: currentUser.phone, stake: 50 });
        }

        socket.on('adminGameWon', (data) => {
            alert('🎉 እንኳን ደስ አለዎት! አሸንፈዋል!');
            document.getElementById('userBalance').innerText = data.newBalance;
        });

        socket.on('errorMsg', msg => alert(msg));

        function openDepositModal() {
            const amount = prompt('ማስገባት የሚፈልጉትን የብር መጠን ያስገቡ (ETB):');
            if(amount) socket.emit('submitDeposit', { phone: currentUser.phone, amount: parseFloat(amount) });
        }

        function openWithdrawModal() {
            const amount = prompt('ማውጣት የሚፈልጉትን የብር መጠን ያስገቡ (አነስተኛ 500 ETB):');
            const accountDetails = prompt('የባንክ/የቴሌብር ሂሳብ መረጃዎን ያስገቡ:');
            if(amount && accountDetails) socket.emit('submitWithdraw', { phone: currentUser.phone, amount: parseFloat(amount), accountDetails });
        }

        socket.on('depositSubmitted', msg => alert(msg));
        socket.on('withdrawSubmitted', msg => alert(msg));
    </script>
</body>
  </html>
