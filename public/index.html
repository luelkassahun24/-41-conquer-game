<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ወርቅ 41 - Conquer Card Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #05140b; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .auth-container { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #183324; padding: 25px; border-radius: 12px; border: 2px solid #ffd700; width: 100%; max-width: 350px; text-align: center; }
        .auth-box h2 { color: #ffd700; margin-bottom: 15px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: #0b1d13; border: 1px solid #2d5a3f; border-radius: 6px; color: #fff; font-size: 16px; text-align: center; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 10px; background: #ffd700; border: none; border-radius: 6px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .game-screen { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; position: relative; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #12281c; padding: 10px 15px; border-radius: 8px; border: 1px solid #2d5a3f; }
        .balance-box { color: #ffd700; font-weight: bold; font-size: 18px; }
        
        /* ጨዋታ ሲጀመር የሚሸሸግ መምረጫ */
        .game-mode-selector { text-align: center; margin: 10px 0; background: #12281c; padding: 12px; border-radius: 8px; border: 1px solid #2d5a3f; transition: all 0.3s ease; }
        .game-mode-selector h3 { color: #ffd700; margin-bottom: 8px; font-size: 15px; }
        .mode-btn-group { display: flex; gap: 10px; justify-content: center; }

        .table-area { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 15px 0; }
        .pile-box { width: 75px; height: 110px; border-radius: 8px; border: 2px dashed #2d5a3f; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(18, 40, 28, 0.6); position: relative; cursor: pointer; }
        .pile-box.deck { background: #1a422b; border: 2px solid #ffd700; }
        .pile-title { position: absolute; top: -20px; font-size: 12px; color: #aaa; white-space: nowrap; }

        /* የካርታ አደራደርና የመጎተት ስታይል */
        .hand-container { position: relative; height: 210px; width: 100%; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 10px; touch-action: none; }
        .card { width: 72px; height: 112px; background: #fff; color: #111; border-radius: 8px; position: absolute; bottom: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: space-between; padding: 6px; font-weight: bold; cursor: grab; border: 2px solid #ccc; transition: transform 0.1s ease; user-select: none; }
        .card.red { color: #d00000; }
        .card.active-drag { z-index: 200 !important; border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.8); }

        .card-top { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
        .card-value { font-size: 15px; }
        .card-suit-small { font-size: 14px; }
        .card-suit-center { font-size: 32px; text-align: center; line-height: 1; margin-top: 2px; }
        .card-bottom { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; transform: rotate(180deg); }

        .action-bars { display: flex; gap: 8px; justify-content: center; margin-bottom: 5px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-group { background: #007bff; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>ወርቅ 41 (Werq 41)</h2>
            <input type="text" id="authName" placeholder="ሙሉ ስም">
            <input type="tel" id="authPhone" placeholder="ስልክ ቁጥር">
            <input type="password" id="authPass" placeholder="የይለፍ ቃል">
            <button onclick="register()">3 ቀን ነፃ ተመዝገብ (Register)</button>
            <button onclick="login()" style="background: transparent; color: #ffd700; border: 1px solid #ffd700; margin-top: 8px;">ይግቡ (Login)</button>
        </div>
    </div>

    <!-- Main Game Interface -->
    <div id="gameScreen" class="game-screen" style="display: none;">
        <div class="header-bar">
            <div>👤 <span id="userDisplayName">-</span></div>
            <div class="balance-box">💰 <span id="userBalance">0</span> ETB</div>
        </div>

        <!-- Mode Selector (ጨዋታ ሲጀምር የሚጠፋ) -->
        <div class="game-mode-selector" id="modeSelector">
            <h3>🎮 የጨዋታ አይነት ይምረጡ</h3>
            <div class="mode-btn-group">
                <button class="btn btn-primary" onclick="startGame('BOT')">🤖 ከአድሚን (Bot)</button>
                <button class="btn btn-group" onclick="startGame('GROUP')">👥 የቡድን ጨዋታ</button>
            </div>
        </div>

        <!-- Table Area -->
        <div class="table-area">
            <div class="pile-box deck" onclick="drawCard()">
                <span class="pile-title">ቁልል ካርታ</span>
                <span style="font-size: 28px;">🎴</span>
            </div>
            <div class="pile-box" id="discardPile">
                <span class="pile-title">መጣያ ካርታ</span>
                <div id="discardContent" style="color: #666; font-size: 12px;">ባዶ</div>
            </div>
        </div>

        <div class="action-bars">
            <button class="btn btn-success" onclick="claimWin()">🏆 SHOW (አሸንፌአለሁ)</button>
            <button class="btn btn-primary" onclick="openDepositModal()">💳 ብር አስገባ</button>
            <button class="btn btn-danger" onclick="openWithdrawModal()">💸 ብር አውጣ</button>
        </div>

        <div class="hand-container" id="playerHand"></div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentHand = [];
        let activeIndex = null;
        let startX = 0;

        function register() {
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function login() {
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function initDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('userDisplayName').innerText = currentUser.name;
            document.getElementById('userBalance').innerText = currentUser.balance;
        }

        function startGame(mode) {
            if(!currentUser) return;
            socket.emit('startGame', { phone: currentUser.phone, mode: mode });
        }

        socket.on('gameStarted', (data) => {
            currentHand = data.playerHand;
            // ጨዋታው ሲጀምር መምረጫው እንዲጠፋ ይደረጋል
            document.getElementById('modeSelector').style.display = 'none';
            renderHand();
        });

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = currentHand.length;
            
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.className = `card ${isRed ? 'red' : ''}`;
                
                const offset = (index - (total - 1) / 2);
                const angle = offset * 3.5;
                const translateX = offset * 25;

                cardEl.style.transform = `translateX(${translateX}px) rotate(${angle}deg)`;

                cardEl.innerHTML = `
                    <div class="card-top">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${card.suit}</span>
                    </div>
                    <div class="card-suit-center">${card.suit}</div>
                    <div class="card-bottom">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${card.suit}</span>
                    </div>
                `;

                // ቀሊል የ touch/mouse እንቅስቃሴ
                bindCardTouch(cardEl, index);
                container.appendChild(cardEl);
            });
        }

        function bindCardTouch(el, index) {
            const handleStart = (e) => {
                activeIndex = index;
                startX = e.touches ? e.touches[0].clientX : e.clientX;
                el.classList.add('active-drag');
            };

            const handleMove = (e) => {
                if (activeIndex === null || activeIndex !== index) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const diff = currentX - startX;

                // 25px ያህል ወደ ግራ ወይም ቀኝ ሲጎተት ቦታ መቀያየር
                if (diff > 25 && index < currentHand.length - 1) {
                    swapCards(index, index + 1);
                    activeIndex = null;
                } else if (diff < -25 && index > 0) {
                    swapCards(index, index - 1);
                    activeIndex = null;
                }
            };

            const handleEnd = () => {
                activeIndex = null;
                el.classList.remove('active-drag');
            };

            el.addEventListener('touchstart', handleStart, {passive: true});
            el.addEventListener('touchmove', handleMove, {passive: true});
            el.addEventListener('touchend', handleEnd);

            el.addEventListener('mousedown', handleStart);
            el.addEventListener('mousemove', handleMove);
            el.addEventListener('mouseup', handleEnd);
        }

        function swapCards(i, j) {
            const temp = currentHand[i];
            currentHand[i] = currentHand[j];
            currentHand[j] = temp;
            renderHand();
        }

        function drawCard() {
            if(currentHand.length === 0) return alert('እባክዎ መጀመሪያ ጨዋታ ይጀምሩ!');
            socket.emit('drawCard', { phone: currentUser.phone });
        }

        socket.on('cardDrawn', (card) => {
            currentHand.push(card);
            renderHand();
        });

        function claimWin() {
            if(!currentUser) return;
            socket.emit('claimWin', { phone: currentUser.phone });
        }

        socket.on('gameWon', (data) => {
            alert('🎉 እንኳን ደስ አለዎት! አሸንፈዋል!');
            document.getElementById('userBalance').innerText = data.newBalance;
        });

        function openDepositModal() {
            const amount = prompt('ማስገባት የሚፈልጉትን የብር መጠን ያስገቡ (ETB):');
            if(amount) socket.emit('submitDeposit', { phone: currentUser.phone, amount: parseFloat(amount) });
        }

        function openWithdrawModal() {
            const amount = prompt('ማውጣት የሚፈልጉትን የብር መጠን ያስገቡ (አነስተኛ 500 ETB):');
            const accountDetails = prompt('የባንክ/የቴሌብር ሂሳብ መረጃዎን ያስገቡ:');
            if(amount && accountDetails) socket.emit('submitWithdraw', { phone: currentUser.phone, amount: parseFloat(amount), accountDetails });
        }

        socket.on('depositSubmitted', msg => alert(msg));
        socket.on('withdrawSubmitted', msg => alert(msg));
        socket.on('errorMsg', msg => alert(msg));
    </script>
</body>
    </html>
