<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gin Rummy 13</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: Arial, sans-serif; 
            background: radial-gradient(circle, #6e1a2d 20%, #2b050c 90%);
            color: #fff; height: 100vh; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }

        .game-table {
            width: 100vw; height: 100vh; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 10px;
        }

        /* Top HUD */
        .top-left-info { position: absolute; top: 15px; left: 15px; display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 45px; height: 45px; background: #220409; border: 2px solid #6e2535;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .bet-box { background: rgba(0, 0, 0, 0.7); border: 1px solid #ffd700; border-radius: 8px; padding: 4px 10px; font-size: 11px; }
        .bet-box .val { color: #ffd700; font-weight: bold; font-size: 13px; }

        .top-right-info { position: absolute; top: 15px; right: 15px; text-align: right; font-size: 12px; color: #ccc; }
        .top-right-info span { color: #fff; font-weight: bold; }

        /* Badges */
        .player-badge {
            background: linear-gradient(180deg, #380b15, #1d0309);
            border: 2px solid #8e2b40; border-radius: 25px; padding: 4px 18px;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00ff66; background: #fff; }
        .stat-group { text-align: center; font-size: 10px; color: #aaa; }
        .stat-group .val { color: #fff; font-weight: bold; font-size: 12px; }

        /* Middle Play Area */
        .middle-area {
            display: flex; justify-content: center; align-items: center; gap: 30px;
            position: absolute; top: 40%; transform: translateY(-50%); width: 100%;
        }

        .deck-box {
            width: 80px; height: 112px; background: #80182a; border: 2px solid #fff;
            border-radius: 8px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; box-shadow: 0 6px 12px rgba(0,0,0,0.6); cursor: pointer;
        }
        .deck-box .title { font-size: 11px; font-weight: bold; color: #ffd700; text-transform: uppercase; text-align: center; }
        .deck-box .count { font-size: 20px; font-weight: bold; margin-top: 4px; }

        .pass-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ffe066, #d49b00); border: 4px solid #fff;
            color: #000; font-weight: 900; font-size: 18px; display: flex; justify-content: center;
            align-items: center; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); cursor: pointer;
        }

        .discard-box {
            width: 80px; height: 112px; border-radius: 8px; border: 3px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8); cursor: pointer; background: rgba(0,0,0,0.3);
        }

        /* Card Graphics */
        .card-face {
            width: 100%; height: 100%; background: #fff; color: #111; border-radius: 8px;
            padding: 4px; display: flex; flex-direction: column; justify-content: space-between;
            font-weight: bold; box-shadow: -2px 4px 8px rgba(0,0,0,0.4); position: relative; pointer-events: none;
        }
        .card-face.red { color: #d00000; }
        .card-val { font-size: 16px; line-height: 1; }
        .card-suit { font-size: 12px; line-height: 1; }
        .card-center-suit { font-size: 28px; text-align: center; position: absolute; top: 35%; left: 30%; }

        /* Hand Container & Dragging */
        .bottom-section { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 5px; }
        
        .hand-container {
            position: relative; height: 140px; width: 100%; max-width: 750px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .hand-card {
            width: 75px; height: 110px; position: absolute; bottom: 0;
            transform-origin: bottom center; cursor: grab; transition: transform 0.15s ease;
        }

        .hand-card.dragging {
            opacity: 0.6;
            cursor: grabbing;
        }

        .timer-display {
            position: absolute; top: -25px; background: rgba(0,0,0,0.8); border: 1px solid #ffd700;
            color: #ffd700; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-table">
        <div class="top-left-info">
            <div class="icon-btn">🔊</div>
            <div class="bet-box">
                <div>Total Bet</div>
                <div class="val">2.000</div>
            </div>
        </div>

        <div class="top-right-info">
            <div>To finish: <span>100</span></div>
            <div>To knock: <span>10</span></div>
        </div>

        <!-- Opponent Area -->
        <div style="margin-top: 5px;">
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar"></div>
                <div>
                    <div style="font-size: 12px; font-weight: bold;">Hilal</div>
                    <div style="font-size: 10px; color: #ffd700;">🟡 127.000</div>
                </div>
            </div>
        </div>

        <!-- Board Center -->
        <div class="middle-area">
            <div class="deck-box" onclick="drawCard('deck')">
                <div class="title">GIN<br>rummy</div>
                <div class="count" id="deckCount">31</div>
            </div>

            <div class="pass-btn">PASS</div>

            <div class="discard-box" id="discardPile" onclick="drawCard('discard')"></div>
        </div>

        <!-- Bottom Player Area -->
        <div class="bottom-section">
            <div class="timer-display" id="timer">⏱️ 15s</div>
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar" style="border-color: #ffd700;"></div>
                <div class="stat-group">
                    <div>Deadwood</div>
                    <div class="val" id="deadwoodVal">0/10</div>
                </div>
            </div>

            <!-- 13/14 Reorderable Cards -->
            <div class="hand-container" id="playerHand"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let playerHand = [];
        let draggedIndex = null;

        socket.emit('initGame');

        socket.on('gameStarted', (data) => {
            playerHand = data.playerHand;
            document.getElementById('deckCount').innerText = data.deckCount;
            renderDiscard(data.topDiscard);
            renderHand();
        });

        socket.on('timerUpdate', (time) => {
            document.getElementById('timer').innerText = `⏱️ ${time}s`;
        });

        function calculateDeadwood() {
            let sum = playerHand.reduce((acc, card) => acc + card.points, 0);
            document.getElementById('deadwoodVal').innerText = `${sum}/10`;
        }

        function renderDiscard(card) {
            const container = document.getElementById('discardPile');
            if(!card) { container.innerHTML = ''; return; }
            const isRed = card.suit === '♥' || card.suit === '♦';
            container.innerHTML = `
                <div class="card-face ${isRed ? 'red' : ''}">
                    <div><div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div></div>
                    <div class="card-center-suit">${card.suit}</div>
                    <div style="transform: rotate(180deg); align-self: flex-end;">
                        <div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div>
                    </div>
                </div>
            `;
        }

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = playerHand.length;

            playerHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'hand-card';
                cardEl.draggable = true;
                cardEl.dataset.index = index;

                // Fan Arc Curve Positioning
                const mid = (total - 1) / 2;
                const offset = index - mid;
                const angle = offset * 3; 
                const translateX = offset * 22;
                const translateY = Math.abs(offset) * 2;

                cardEl.style.transform = `translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;

                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.innerHTML = `
                    <div class="card-face ${isRed ? 'red' : ''}">
                        <div><div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div></div>
                        <div class="card-center-suit">${card.suit}</div>
                        <div style="transform: rotate(180deg); align-self: flex-end;">
                            <div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div>
                        </div>
                    </div>
                `;

                // Drag & Drop Hand Reordering Events
                cardEl.addEventListener('dragstart', (e) => {
                    draggedIndex = index;
                    cardEl.classList.add('dragging');
                });

                cardEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                cardEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const targetIndex = parseInt(cardEl.dataset.index);
                    if (draggedIndex !== null && draggedIndex !== targetIndex) {
                        const movedCard = playerHand.splice(draggedIndex, 1)[0];
                        playerHand.splice(targetIndex, 0, movedCard);
                        socket.emit('reorderHand', playerHand);
                        renderHand();
                    }
                });

                cardEl.addEventListener('dragend', () => {
                    cardEl.classList.remove('dragging');
                    draggedIndex = null;
                });

                // Double Click to Discard
                cardEl.ondblclick = () => {
                    if (playerHand.length === 14) {
                        socket.emit('discardCard', card.id);
                    }
                };

                container.appendChild(cardEl);
            });

            calculateDeadwood();
        }

        function drawCard(source) {
            socket.emit('drawCard', source);
        }

        socket.on('cardDrawn', (data) => {
            playerHand = data.playerHand;
            document.getElementById('deckCount').innerText = data.deckCount;
            if(data.topDiscard) renderDiscard(data.topDiscard);
            renderHand();
        });

        socket.on('cardDiscarded', (data) => {
            playerHand = data.playerHand;
            renderDiscard(data.topDiscard);
            renderHand();
        });
    </script>
</body>
</html>
