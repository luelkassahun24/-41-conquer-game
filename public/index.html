<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conquer 41 Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { 
            font-family: Arial, sans-serif; 
            background: radial-gradient(circle, #52101e 20%, #20040a 90%);
            color: #fff; height: 100vh; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }

        .game-table {
            width: 100vw; height: 100vh; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
            align-items: center; padding: 10px;
        }

        .top-left-info { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 40px; height: 40px; background: #220409; border: 2px solid #6e2535;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 16px; cursor: pointer;
        }
        .bet-box { background: rgba(0, 0, 0, 0.7); border: 1px solid #ffd700; border-radius: 8px; padding: 3px 8px; font-size: 10px; }
        .bet-box .val { color: #ffd700; font-weight: bold; font-size: 12px; }

        .top-right-info { position: absolute; top: 12px; right: 12px; text-align: right; font-size: 11px; color: #ccc; }
        .top-right-info span { color: #fff; font-weight: bold; }

        .player-badge {
            background: linear-gradient(180deg, #380b15, #1d0309);
            border: 2px solid #8e2b40; border-radius: 20px; padding: 3px 15px;
            display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            z-index: 5;
        }
        .avatar { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #00ff66; background: #fff; }
        .stat-group { text-align: center; font-size: 9px; color: #aaa; }
        .stat-group .val { color: #fff; font-weight: bold; font-size: 11px; }

        /* Middle Area */
        .middle-area {
            display: flex; justify-content: center; align-items: center; gap: 25px;
            position: absolute; top: 38%; transform: translateY(-50%); width: 100%;
        }

        .deck-box {
            width: 75px; height: 105px; background: #7a1526; border: 2px solid #fff;
            border-radius: 8px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; box-shadow: 0 6px 12px rgba(0,0,0,0.6); cursor: pointer;
        }
        .deck-box .title { font-size: 10px; font-weight: bold; color: #ffd700; text-transform: uppercase; text-align: center; }
        .deck-box .count { font-size: 20px; font-weight: bold; margin-top: 2px; }

        .pass-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle, #ffe066, #d49b00); border: 3px solid #fff;
            color: #000; font-weight: 900; font-size: 16px; display: flex; justify-content: center;
            align-items: center; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); cursor: pointer;
        }

        .discard-box {
            width: 75px; height: 105px; border-radius: 8px; border: 3px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8); cursor: pointer; background: rgba(0,0,0,0.3);
        }

        .card-face {
            width: 100%; height: 100%; background: #fff; color: #111; border-radius: 7px;
            padding: 3px; display: flex; flex-direction: column; justify-content: space-between;
            font-weight: bold; box-shadow: -2px 4px 8px rgba(0,0,0,0.4); position: relative; pointer-events: none;
        }
        .card-face.red { color: #d00000; }
        .card-val { font-size: 15px; line-height: 1; }
        .card-suit { font-size: 11px; line-height: 1; }
        .card-center-suit { font-size: 24px; text-align: center; position: absolute; top: 35%; left: 30%; }

        /* Hand Container & Dragging Style */
        .bottom-section { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 5px; }
        
        .hand-container {
            position: relative; height: 130px; width: 100%; max-width: 800px;
            display: flex; justify-content: center; align-items: flex-end;
            touch-action: none;
        }

        .hand-card {
            width: 72px; height: 105px; position: absolute; bottom: 0;
            transform-origin: bottom center; transition: transform 0.15s ease;
            touch-action: none;
        }

        /* ቋሚ ሆኖ በጣት ሲጎተት የሚታይበት ዲዛይን */
        .hand-card.dragging {
            z-index: 1000 !important;
            transition: none !important;
            opacity: 0.9;
            transform: scale(1.1) !important;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="game-table">
        <div class="top-left-info">
            <div class="icon-btn">🔊</div>
            <div class="bet-box">
                <div>Total Bet</div>
                <div class="val">2.000</div>
            </div>
        </div>

        <div class="top-right-info">
            <div>To finish: <span>100</span></div>
            <div>To knock: <span>10</span></div>
        </div>

        <!-- Opponent Area -->
        <div style="margin-top: 5px;">
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar"></div>
                <div>
                    <div style="font-size: 11px; font-weight: bold;">Hilal</div>
                    <div style="font-size: 10px; color: #ffd700;">🟡 127.000</div>
                </div>
            </div>
        </div>

        <!-- Board Center -->
        <div class="middle-area">
            <div class="deck-box" onclick="drawCard('deck')">
                <div class="title">GIN<br>rummy</div>
                <div class="count" id="deckCount">27</div>
            </div>

            <div class="pass-btn">PASS</div>

            <div class="discard-box" id="discardPile" onclick="drawCard('discard')"></div>
        </div>

        <!-- Player Hand Area -->
        <div class="bottom-section">
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar" style="border-color: #ffd700;"></div>
                <div class="stat-group">
                    <div>Deadwood</div>
                    <div class="val" id="deadwoodVal">0/10</div>
                </div>
            </div>

            <div class="hand-container" id="playerHand"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let playerHand = [];

        socket.emit('initGame');

        socket.on('gameStarted', (data) => {
            playerHand = data.playerHand;
            document.getElementById('deckCount').innerText = data.deckCount;
            renderDiscard(data.topDiscard);
            renderHand();
        });

        function calculateDeadwood() {
            let sum = playerHand.reduce((acc, card) => acc + card.points, 0);
            document.getElementById('deadwoodVal').innerText = `${sum}/10`;
        }

        function renderDiscard(card) {
            const container = document.getElementById('discardPile');
            if(!card) { container.innerHTML = ''; return; }
            const isRed = card.suit === '♥' || card.suit === '♦';
            container.innerHTML = `
                <div class="card-face ${isRed ? 'red' : ''}">
                    <div><div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div></div>
                    <div class="card-center-suit">${card.suit}</div>
                    <div style="transform: rotate(180deg); align-self: flex-end;">
                        <div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div>
                    </div>
                </div>
            `;
        }

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = playerHand.length;

            playerHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'hand-card';
                cardEl.dataset.index = index;

                const mid = (total - 1) / 2;
                const offset = index - mid;
                const angle = offset * 2.5; 
                const translateX = offset * 20;
                const translateY = Math.abs(offset) * 2;

                cardEl.style.transform = `translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;

                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.innerHTML = `
                    <div class="card-face ${isRed ? 'red' : ''}">
                        <div><div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div></div>
                        <div class="card-center-suit">${card.suit}</div>
                        <div style="transform: rotate(180deg); align-self: flex-end;">
                            <div class="card-val">${card.value}</div><div class="card-suit">${card.suit}</div>
                        </div>
                    </div>
                `;

                // --- Touch Dragging & Reordering Logic ---
                let initialX = 0;
                let initialY = 0;
                let isDragging = false;

                cardEl.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    initialX = touch.clientX;
                    initialY = touch.clientY;
                    isDragging = true;
                    cardEl.classList.add('dragging');
                }, {passive: false});

                cardEl.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault(); // ገጹ እንዳይወርድ/እንዳይወጣ ይከለክላል

                    const touch = e.touches[0];
                    const deltaX = touch.clientX - initialX;
                    const deltaY = touch.clientY - initialY;

                    // ካርታው በጣትህ እንቅስቃሴ መሰረት አብሮ ይንቀሳቀሳል
                    cardEl.style.transform = `translateX(${translateX + deltaX}px) translateY(${translateY + deltaY}px) rotate(0deg)`;

                    // ጣትህ ያለበትን ቦታ ኤለመንት መፈለጊያ (Overlapping Card check)
                    const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (elemBelow) {
                        const targetCard = elemBelow.closest('.hand-card');
                        if (targetCard && targetCard !== cardEl) {
                            const targetIdx = parseInt(targetCard.dataset.index);
                            const currentIdx = parseInt(cardEl.dataset.index);

                            // በካርታዎቹ እርስ በርስ ቦታ መለዋወጥ
                            const moved = playerHand.splice(currentIdx, 1)[0];
                            playerHand.splice(targetIdx, 0, moved);

                            isDragging = false;
                            renderHand(); // እጁን እንደገና መሳል
                        }
                    }
                }, {passive: false});

                cardEl.addEventListener('touchend', () => {
                    if (isDragging) {
                        isDragging = false;
                        cardEl.classList.remove('dragging');
                        renderHand();
                    }
                });

                // Double Tap to Discard (14ኛ ካርታ ሲኖር)
                let lastTap = 0;
                cardEl.addEventListener('touchend', (e) => {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) {
                        if (playerHand.length === 14) {
                            socket.emit('discardCard', card.id);
                        }
                    }
                    lastTap = currentTime;
                });

                container.appendChild(cardEl);
            });

            calculateDeadwood();
        }

        function drawCard(source) {
            socket.emit('drawCard', source);
        }

        socket.on('cardDrawn', (data) => {
            playerHand = data.playerHand;
            document.getElementById('deckCount').innerText = data.deckCount;
            if(data.topDiscard) renderDiscard(data.topDiscard);
            renderHand();
        });

        socket.on('cardDiscarded', (data) => {
            playerHand = data.playerHand;
            renderDiscard(data.topDiscard);
            renderHand();
        });
    </script>
</body>
</html>
