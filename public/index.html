<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ወርቅ 41 - Conquer Card Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1a10; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .auth-container { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #183324; padding: 25px; border-radius: 12px; border: 2px solid #ffd700; width: 100%; max-width: 350px; text-align: center; }
        .auth-box h2 { color: #ffd700; margin-bottom: 15px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: #0b1d13; border: 1px solid #2d5a3f; border-radius: 6px; color: #fff; font-size: 16px; text-align: center; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 10px; background: #ffd700; border: none; border-radius: 6px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .game-screen { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; position: relative; background: radial-gradient(circle, #1a3c27 0%, #08120b 100%); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(255,215,0,0.3); }
        .balance-box { color: #ffd700; font-weight: bold; font-size: 16px; }

        .top-controls { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; padding: 0 10px; }
        .turn-indicator { font-size: 13px; font-weight: bold; color: #ffd700; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 15px; border: 1px solid #ffd700; white-space: nowrap; }

        .action-bars { display: flex; gap: 6px; }
        .btn { padding: 6px 12px; border: none; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 11px; white-space: nowrap; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-group { background: #007bff; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }

        /* Game Mode Selector Card */
        .game-mode-selector { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(18, 40, 28, 0.95); padding: 25px; border-radius: 16px; border: 2px solid #ffd700; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 50; width: 90%; max-width: 380px; }
        .mode-btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .mode-btn-group .btn { padding: 12px; font-size: 14px; border-radius: 8px; }

        /* Piles Area (Hidden until mode selected) */
        .table-area { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 40px; position: absolute; top: 75px; left: 0; right: 0; pointer-events: none; }
        .pile-box { pointer-events: auto; width: 95px; height: 140px; border-radius: 10px; border: 2px dashed rgba(255,255,255,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.5); position: relative; cursor: pointer; transition: transform 0.2s, border-color 0.2s; overflow: hidden; }
        .pile-box:active { transform: scale(0.95); }
        .pile-box.deck { background: linear-gradient(135deg, #1a422b, #0d2618); border: 2px solid #ffd700; box-shadow: 0 6px 15px rgba(0,0,0,0.6); }
        .pile-box.discard-hover { border-color: #00ff66 !important; background: rgba(0,255,102,0.3) !important; transform: scale(1.05); }
        .pile-title { position: absolute; top: -20px; font-size: 11px; color: #ffd700; white-space: nowrap; font-weight: bold; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 8px; }

        .table-card { width: 100%; height: 100%; background: #fff; color: #111; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; font-weight: bold; border: 1px solid #ccc; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
        .table-card.red { color: #d00000; }

        .hand-container { position: relative; height: 160px; width: 100%; max-width: 650px; margin: auto auto 5px auto; display: flex; justify-content: center; align-items: flex-end; }
        
        .card { 
            width: 95px; height: 140px; background: #fff; color: #111; border-radius: 10px; position: absolute; bottom: 0; 
            box-shadow: -2px 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; 
            padding: 8px; font-weight: bold; cursor: grab; border: 1px solid #ccc; transform-origin: bottom center; 
            transition: transform 0.1s ease-out; touch-action: none; 
        }
        .card.red { color: #d00000; }
        .card.dragging { z-index: 999 !important; transform: scale(1.15) !important; box-shadow: 0 12px 24px rgba(0,0,0,0.8); cursor: grabbing; transition: none !important; }

        .card-top { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
        .card-value { font-size: 18px; }
        .card-suit-small { font-size: 15px; }
        .card-suit-center { font-size: 38px; text-align: center; line-height: 1; margin-top: 2px; }
        .card-bottom { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; transform: rotate(180deg); }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>ወርቅ 41 (Werq 41)</h2>
            <input type="text" id="authName" placeholder="ሙሉ ስም">
            <input type="tel" id="authPhone" placeholder="ስልክ ቁጥር">
            <input type="password" id="authPass" placeholder="የይለፍ ቃል">
            <button onclick="register()">3 ቀን ነፃ ተመዝገብ (Register)</button>
            <button onclick="login()" style="background: transparent; color: #ffd700; border: 1px solid #ffd700; margin-top: 8px;">ይግቡ (Login)</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen" style="display: none;">
        <div class="header-bar">
            <div>👤 <span id="userDisplayName">-</span></div>
            <div class="balance-box">💰 <span id="userBalance">0</span> ETB</div>
        </div>

        <div class="top-controls" id="topControls" style="display: none;">
            <div class="turn-indicator" id="turnIndicator">የእርስዎ ተራ: 15s</div>
            <div class="action-bars">
                <button class="btn btn-success" onclick="claimWin()">🏆 SHOW</button>
                <button class="btn btn-primary" onclick="openDepositModal()">💳 አስገባ</button>
                <button class="btn btn-danger" onclick="openWithdrawModal()">💸 አውጣ</button>
            </div>
        </div>

        <div class="game-mode-selector" id="modeSelector">
            <h3 style="color: #ffd700; font-size: 16px;">🎮 የጨዋታ አይነት ይምረጡ</h3>
            <div class="mode-btn-group">
                <button class="btn btn-primary" onclick="startGame('BOT')">🤖 ከአድሚን/ቦት (Bot)</button>
                <button class="btn btn-group" onclick="startGame('GROUP')">👥 የቡድን ጨዋታ</button>
            </div>
        </div>

        <!-- Mada / Piles hidden initially -->
        <div class="table-area" id="tableArea" style="display: none;">
            <div class="pile-box deck" onclick="drawCard()">
                <span class="pile-title">ቁልል (Draw)</span>
                <span style="font-size: 45px;">🎴</span>
            </div>
            <div class="pile-box" id="discardPile" onclick="drawFromDiscard()">
                <span class="pile-title">መጣያ (Discard)</span>
                <div id="discardContent" style="color: #aaa; font-size: 12px; text-align: center;">ባዶ</div>
            </div>
        </div>

        <div class="hand-container" id="playerHand" style="display: none;"></div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentHand = [];
        let draggedCardIdx = null;
        let isMyTurn = true;
        let topDiscardCard = null;

        function register() {
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function login() {
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function initDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('userDisplayName').innerText = currentUser.name;
            document.getElementById('userBalance').innerText = currentUser.balance;
        }

        function startGame(mode) {
            if(!currentUser) return;
            socket.emit('startGame', { phone: currentUser.phone, mode: mode });
        }

        socket.on('gameStarted', (data) => {
            currentHand = data.playerHand;
            // Hide selector, show game play controls and table
            document.getElementById('modeSelector').style.display = 'none';
            document.getElementById('topControls').style.display = 'flex';
            document.getElementById('tableArea').style.display = 'flex';
            document.getElementById('playerHand').style.display = 'flex';
            renderHand();
        });

        socket.on('turnUpdate', (data) => {
            isMyTurn = data.isMyTurn;
            const indicator = document.getElementById('turnIndicator');
            indicator.innerText = data.text;
            indicator.style.color = isMyTurn ? '#ffd700' : '#ff4d4d';
        });

        socket.on('timerTick', (timeLeft) => {
            const indicator = document.getElementById('turnIndicator');
            indicator.innerText = (isMyTurn ? "የእርስዎ ተራ: " : "የተቃራኒ ተራ: ") + timeLeft + "s";
        });

        function getSuitSymbol(suitStr) {
            if (suitStr === '♥' || suitStr === 'H' || suitStr === 'hearts') return '♥';
            if (suitStr === '♦' || suitStr === 'D' || suitStr === 'diamonds') return '♦';
            if (suitStr === '♣' || suitStr === 'C' || suitStr === 'clubs') return '♣';
            return '♠';
        }

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = currentHand.length;
            
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                const suitSymbol = getSuitSymbol(card.suit);
                const isRed = suitSymbol === '♥' || suitSymbol === '♦';
                cardEl.className = `card ${isRed ? 'red' : ''}`;
                
                const mid = (total - 1) / 2;
                const offset = index - mid;
                const angle = offset * 3.5; 
                const translateX = offset * 32;
                const translateY = Math.abs(offset) * 2;

                cardEl.style.transform = `translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-top">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${suitSymbol}</span>
                    </div>
                    <div class="card-suit-center">${suitSymbol}</div>
                    <div class="card-bottom">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${suitSymbol}</span>
                    </div>
                `;

                cardEl.addEventListener('dblclick', () => discardCard(index));
                attachSmoothDrag(cardEl, index);
                container.appendChild(cardEl);
            });
        }

        function attachSmoothDrag(el, index) {
            let startX, startY;

            const getTouchPos = (e) => {
                return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
            };

            const onStart = (e) => {
                if(!isMyTurn) return;
                draggedCardIdx = index;
                const pos = getTouchPos(e);
                startX = pos.x;
                startY = pos.y;
                el.classList.add('dragging');
            };

            const onMove = (e) => {
                if (draggedCardIdx === null) return;
                const pos = getTouchPos(e);
                const moveX = pos.x - startX;
                const moveY = pos.y - startY;

                el.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.15)`;

                const discardRect = document.getElementById('discardPile').getBoundingClientRect();
                if (pos.x >= discardRect.left && pos.x <= discardRect.right &&
                    pos.y >= discardRect.top && pos.y <= discardRect.bottom) {
                    document.getElementById('discardPile').classList.add('discard-hover');
                } else {
                    document.getElementById('discardPile').classList.remove('discard-hover');
                }
            };

            const onEnd = (e) => {
                if (draggedCardIdx === null) return;
                const endPos = e.changedTouches ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : { x: e.clientX, y: e.clientY };
                const discardRect = document.getElementById('discardPile').getBoundingClientRect();

                if (endPos.x >= discardRect.left && endPos.x <= discardRect.right &&
                    endPos.y >= discardRect.top && endPos.y <= discardRect.bottom) {
                    discardCard(index);
                } else {
                    const moveX = endPos.x - startX;
                    const shiftIndex = Math.round(moveX / 35);
                    if (shiftIndex !== 0) {
                        let newIdx = index + shiftIndex;
                        if (newIdx < 0) newIdx = 0;
                        if (newIdx >= currentHand.length) newIdx = currentHand.length - 1;
                        
                        const item = currentHand.splice(index, 1)[0];
                        currentHand.splice(newIdx, 0, item);
                    }
                    renderHand();
                }

                draggedCardIdx = null;
                document.getElementById('discardPile').classList.remove('discard-hover');
            };

            el.addEventListener('touchstart', onStart, {passive: true});
            el.addEventListener('touchmove', onMove, {passive: true});
            el.addEventListener('touchend', onEnd);

            el.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
        }

        function discardCard(index) {
            if (!isMyTurn) return alert('እባክዎ የተራዎን ሰዓት ይጠብቁ!');
            if (currentHand.length <= 13) {
                return alert('መጀመሪያ ከቁልሉ ወይም ከመሬት ካርታ መሳብ አለብዎት!');
            }

            const discarded = currentHand.splice(index, 1)[0];
            renderHand();
            socket.emit('discardCard', { phone: currentUser.phone, card: discarded });
        }

        function drawCard() {
            if (!isMyTurn) return alert('እባክዎ የተራዎን ሰዓት ይጠብቁ!');
            if (currentHand.length >= 14) {
                return alert('14 ካርታ አለዎት! መጀመሪያ የማትፈልጉትን አንድ ካርታ ይጣሉ!');
            }
            socket.emit('drawCard', { phone: currentUser.phone });
        }

        function drawFromDiscard() {
            if (!isMyTurn) return alert('እባክዎ የተራዎን ሰዓት ይጠብቁ!');
            if (currentHand.length >= 14) return alert('14 ካርታ አለዎት! መጀመሪያ ካርታ ይጣሉ!');
            if (!topDiscardCard) return alert('በመጣያ ቦታ ላይ ምንም ካርታ የለም!');

            socket.emit('drawFromDiscard', { phone: currentUser.phone });
        }

        socket.on('cardDrawn', (card) => {
            currentHand.push(card);
            renderHand();
        });

        socket.on('updateDiscardPile', (card) => {
            topDiscardCard = card;
            const pile = document.getElementById('discardContent');
            if(!card) {
                pile.innerHTML = '<span style="color:#aaa; font-size:12px">ባዶ</span>';
                return;
            }
            const suitSymbol = getSuitSymbol(card.suit);
            const isRed = suitSymbol === '♥' || suitSymbol === '♦';
            pile.innerHTML = `
                <div class="table-card ${isRed ? 'red' : ''}">
                    <div class="card-top">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${suitSymbol}</span>
                    </div>
                    <div class="card-suit-center">${suitSymbol}</div>
                    <div class="card-bottom">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${suitSymbol}</span>
                    </div>
                </div>
            `;
        });

        function claimWin() {
            if(!currentUser) return;
            socket.emit('claimWin', { phone: currentUser.phone });
        }

        socket.on('gameWon', (data) => {
            alert('🎉 እንኳን ደስ አለዎት! አሸንፈዋል!');
            document.getElementById('userBalance').innerText = data.newBalance;
        });

        function openDepositModal() {
            const amount = prompt('ማስገባት የሚፈልጉትን የብር መጠን ያስገቡ (ETB):');
            if(amount) socket.emit('submitDeposit', { phone: currentUser.phone, amount: parseFloat(amount) });
        }

        function openWithdrawModal() {
            const amount = prompt('ማውጣት የሚፈልጉትን የብር መጠን ያስገቡ (አነስተኛ 500 ETB):');
            const accountDetails = prompt('የባንክ/የቴሌብር ሂሳብ መረጃዎን ያስገቡ:');
            if(amount && accountDetails) socket.emit('submitWithdraw', { phone: currentUser.phone, amount: parseFloat(amount), accountDetails });
        }

        socket.on('depositSubmitted', msg => alert(msg));
        socket.on('withdrawSubmitted', msg => alert(msg));
        socket.on('errorMsg', msg => alert(msg));
    </script>
</body>
</html>
