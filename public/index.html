<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ወርቅ 41 - Conquer Card Game</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1a10; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .auth-container { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: #183324; padding: 25px; border-radius: 12px; border: 2px solid #ffd700; width: 100%; max-width: 350px; text-align: center; }
        .auth-box h2 { color: #ffd700; margin-bottom: 15px; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; background: #0b1d13; border: 1px solid #2d5a3f; border-radius: 6px; color: #fff; font-size: 16px; text-align: center; }
        .auth-box button { width: 100%; padding: 12px; margin-top: 10px; background: #ffd700; border: none; border-radius: 6px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .game-screen { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; padding: 10px; position: relative; background: radial-gradient(circle, #1a3c27 0%, #08120b 100%); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,215,0,0.3); }
        .balance-box { color: #ffd700; font-weight: bold; font-size: 16px; }

        .game-mode-selector { text-align: center; margin: 10px 0; background: rgba(18, 40, 28, 0.9); padding: 12px; border-radius: 12px; border: 1px solid #ffd700; }
        .mode-btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }

        /* Table & Cards Pile */
        .table-area { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 20px; }
        .pile-box { width: 75px; height: 108px; border-radius: 8px; border: 2px dashed rgba(255,255,255,0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.3); position: relative; cursor: pointer; transition: transform 0.2s; }
        .pile-box:active { transform: scale(0.95); }
        .pile-box.deck { background: #1a422b; border: 2px solid #ffd700; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .pile-box.discard-hover { border-color: #00ff66; background: rgba(0,255,102,0.1); }
        .pile-title { position: absolute; top: -22px; font-size: 11px; color: #ccc; white-space: nowrap; font-weight: bold; }

        .action-bars { display: flex; gap: 8px; justify-content: center; margin-bottom: 5px; z-index: 10; }
        .btn { padding: 8px 14px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-group { background: #007bff; color: #fff; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-danger { background: #dc3545; color: #fff; }

        /* Gin Rummy Style Curved Fan Hand */
        .hand-container { position: relative; height: 180px; width: 100%; max-width: 500px; margin: 0 auto 10px auto; display: flex; justify-content: center; align-items: flex-end; }
        
        .card { 
            width: 70px; height: 105px; background: #fff; color: #111; border-radius: 8px; position: absolute; bottom: 0; 
            box-shadow: -2px 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; 
            padding: 5px; font-weight: bold; cursor: grab; border: 1px solid #ccc; transform-origin: bottom center; 
            transition: transform 0.15s ease-out, box-shadow 0.15s; touch-action: none; 
        }
        .card.red { color: #d00000; }
        .card.dragging { z-index: 999 !important; transform: scale(1.15) !important; box-shadow: 0 10px 20px rgba(0,0,0,0.7); cursor: grabbing; }

        .card-top { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
        .card-value { font-size: 14px; }
        .card-suit-small { font-size: 12px; }
        .card-suit-center { font-size: 28px; text-align: center; line-height: 1; margin-top: 2px; }
        .card-bottom { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; transform: rotate(180deg); }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <h2>ወርቅ 41 (Werq 41)</h2>
            <input type="text" id="authName" placeholder="ሙሉ ስም">
            <input type="tel" id="authPhone" placeholder="ስልክ ቁጥር">
            <input type="password" id="authPass" placeholder="የይለፍ ቃል">
            <button onclick="register()">3 ቀን ነፃ ተመዝገብ (Register)</button>
            <button onclick="login()" style="background: transparent; color: #ffd700; border: 1px solid #ffd700; margin-top: 8px;">ይግቡ (Login)</button>
        </div>
    </div>

    <div id="gameScreen" class="game-screen" style="display: none;">
        <div class="header-bar">
            <div>👤 <span id="userDisplayName">-</span></div>
            <div class="balance-box">💰 <span id="userBalance">0</span> ETB</div>
        </div>

        <div class="game-mode-selector" id="modeSelector">
            <h3 style="color: #ffd700; font-size: 14px;">🎮 የጨዋታ አይነት ይምረጡ</h3>
            <div class="mode-btn-group">
                <button class="btn btn-primary" onclick="startGame('BOT')">🤖 ከአድሚን (Bot)</button>
                <button class="btn btn-group" onclick="startGame('GROUP')">👥 የቡድን ጨዋታ</button>
            </div>
        </div>

        <div class="table-area">
            <div class="pile-box deck" onclick="drawCard()">
                <span class="pile-title">ቁልል (Draw)</span>
                <span style="font-size: 28px;">🎴</span>
            </div>
            <div class="pile-box" id="discardPile">
                <span class="pile-title">መጣያ (Discard)</span>
                <div id="discardContent" style="color: #aaa; font-size: 12px; text-align: center;">ካርታ ለመጣል እዚህ ይጎትቱ</div>
            </div>
        </div>

        <div class="action-bars">
            <button class="btn btn-success" onclick="claimWin()">🏆 SHOW (አሸንፌአለሁ)</button>
            <button class="btn btn-primary" onclick="openDepositModal()">💳 ብር አስገባ</button>
            <button class="btn btn-danger" onclick="openWithdrawModal()">💸 ብር አውጣ</button>
        </div>

        <div class="hand-container" id="playerHand"></div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentHand = [];
        let draggedCardIdx = null;

        function register() {
            const name = document.getElementById('authName').value;
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function login() {
            const phone = document.getElementById('authPhone').value;
            const password = document.getElementById('authPass').value;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            }).then(r => r.json()).then(data => {
                if(data.error) return alert(data.error);
                currentUser = data.user;
                initDashboard();
            });
        }

        function initDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('userDisplayName').innerText = currentUser.name;
            document.getElementById('userBalance').innerText = currentUser.balance;
        }

        function startGame(mode) {
            if(!currentUser) return;
            socket.emit('startGame', { phone: currentUser.phone, mode: mode });
        }

        socket.on('gameStarted', (data) => {
            currentHand = data.playerHand;
            document.getElementById('modeSelector').style.display = 'none';
            renderHand();
        });

        // Gin Rummy Arc Layout Render
        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = currentHand.length;
            
            currentHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.className = `card ${isRed ? 'red' : ''}`;
                
                // Gin Rummy Arc Calculation
                const mid = (total - 1) / 2;
                const offset = index - mid;
                const angle = offset * 4.5; 
                const translateX = offset * 26;
                const translateY = Math.abs(offset) * 3;

                cardEl.style.transform = `translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-top">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${card.suit}</span>
                    </div>
                    <div class="card-suit-center">${card.suit}</div>
                    <div class="card-bottom">
                        <span class="card-value">${card.value}</span>
                        <span class="card-suit-small">${card.suit}</span>
                    </div>
                `;

                // Double Click/Tap to quick discard
                cardEl.addEventListener('dblclick', () => discardCard(index));

                attachFastDrag(cardEl, index);
                container.appendChild(cardEl);
            });
        }

        // Fast & Smooth Drag Logic
        function attachFastDrag(el, index) {
            let startX, startY, origTransform;

            const onTouchStart = (e) => {
                draggedCardIdx = index;
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                origTransform = el.style.transform;
                el.classList.add('dragging');
            };

            const onTouchMove = (e) => {
                if (draggedCardIdx === null) return;
                const touch = e.touches ? e.touches[0] : e;
                const moveX = touch.clientX - startX;
                const moveY = touch.clientY - startY;

                el.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.1)';`;

                // Check Discard Pile Hover
                const discardRect = document.getElementById('discardPile').getBoundingClientRect();
                if (touch.clientX >= discardRect.left && touch.clientX <= discardRect.right &&
                    touch.clientY >= discardRect.top && touch.clientY <= discardRect.bottom) {
                    document.getElementById('discardPile').classList.add('discard-hover');
                } else {
                    document.getElementById('discardPile').classList.remove('discard-hover');
                }
            };

            const onTouchEnd = (e) => {
                if (draggedCardIdx === null) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                const discardRect = document.getElementById('discardPile').getBoundingClientRect();

                // Drop in Discard Pile
                if (touch.clientX >= discardRect.left && touch.clientX <= discardRect.right &&
                    touch.clientY >= discardRect.top && touch.clientY <= discardRect.bottom) {
                    discardCard(index);
                } else {
                    // Quick Re-order calculation based on X movement
                    const moveX = touch.clientX - startX;
                    const shiftIndex = Math.round(moveX / 30);
                    if (shiftIndex !== 0) {
                        let newIdx = index + shiftIndex;
                        if (newIdx < 0) newIdx = 0;
                        if (newIdx >= currentHand.length) newIdx = currentHand.length - 1;
                        
                        const item = currentHand.splice(index, 1)[0];
                        currentHand.splice(newIdx, 0, item);
                    }
                    renderHand();
                }

                draggedCardIdx = null;
                document.getElementById('discardPile').classList.remove('discard-hover');
            };

            el.addEventListener('touchstart', onTouchStart, {passive: true});
            el.addEventListener('touchmove', onTouchMove, {passive: true});
            el.addEventListener('touchend', onTouchEnd);

            el.addEventListener('mousedown', onTouchStart);
            window.addEventListener('mousemove', onTouchMove);
            window.addEventListener('mouseup', onTouchEnd);
        }

        // Discard Functionality
        function discardCard(index) {
            const discarded = currentHand.splice(index, 1)[0];
            const isRed = discarded.suit === '♥' || discarded.suit === '♦';
            
            document.getElementById('discardContent').innerHTML = `
                <div style="font-size:20px; font-weight:bold; color:${isRed ? '#d00000' : '#fff'}; background:#fff; padding:6px 12px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.5)">
                    ${discarded.value} ${discarded.suit}
                </div>
            `;
            renderHand();
            socket.emit('discardCard', { phone: currentUser.phone, card: discarded });
        }

        function drawCard() {
            if(currentHand.length === 0) return alert('እባክዎ መጀመሪያ ጨዋታ ይጀምሩ!');
            socket.emit('drawCard', { phone: currentUser.phone });
        }

        socket.on('cardDrawn', (card) => {
            currentHand.push(card);
            renderHand();
        });

        function claimWin() {
            if(!currentUser) return;
            socket.emit('claimWin', { phone: currentUser.phone });
        }

        socket.on('gameWon', (data) => {
            alert('🎉 እንኳን ደስ አለዎት! አሸንፈዋል!');
            document.getElementById('userBalance').innerText = data.newBalance;
        });

        function openDepositModal() {
            const amount = prompt('ማስገባት የሚፈልጉትን የብር መጠን ያስገቡ (ETB):');
            if(amount) socket.emit('submitDeposit', { phone: currentUser.phone, amount: parseFloat(amount) });
        }

        function openWithdrawModal() {
            const amount = prompt('ማውጣት የሚፈልጉትን የብር መጠን ያስገቡ (አነስተኛ 500 ETB):');
            const accountDetails = prompt('የባንክ/የቴሌብር ሂሳብ መረጃዎን ያስገቡ:');
            if(amount && accountDetails) socket.emit('submitWithdraw', { phone: currentUser.phone, amount: parseFloat(amount), accountDetails });
        }

        socket.on('depositSubmitted', msg => alert(msg));
        socket.on('withdrawSubmitted', msg => alert(msg));
        socket.on('errorMsg', msg => alert(msg));
    </script>
</body>
</html>
