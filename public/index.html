<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gin Rummy</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: #4a101d; 
            background-image: radial-gradient(#6e1a2d 20%, #300810 90%);
            color: #fff; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .game-table {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        /* Top Bar Info */
        .top-left-info {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            width: 45px;
            height: 45px;
            background: #2b0810;
            border: 2px solid #6e2535;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .bet-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ffd700;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 12px;
            text-align: center;
        }
        .bet-box .val { color: #ffd700; font-weight: bold; font-size: 14px; }

        .top-right-info {
            position: absolute;
            top: 15px;
            right: 15px;
            text-align: right;
            font-size: 13px;
            color: #ccc;
        }
        .top-right-info span { color: #fff; font-weight: bold; margin-left: 5px; }

        /* Players Info Boxes */
        .opponent-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }
        .player-badge {
            background: linear-gradient(180deg, #380b15, #1d0309);
            border: 2px solid #8e2b40;
            border-radius: 25px;
            padding: 4px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00ff66;
            background: #fff;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .stat-group { text-align: center; font-size: 11px; color: #aaa; }
        .stat-group .val { color: #fff; font-weight: bold; font-size: 13px; }

        /* Middle Table Play Area */
        .middle-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: absolute;
            top: 42%;
            transform: translateY(-50%);
            width: 100%;
        }

        .deck-box {
            width: 85px;
            height: 120px;
            background: #80182a;
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            cursor: pointer;
            position: relative;
        }
        .deck-box .title { font-size: 12px; font-weight: bold; color: #ffd700; text-transform: uppercase; }
        .deck-box .count { font-size: 22px; font-weight: bold; margin-top: 5px; }

        .pass-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066, #d49b00);
            border: 4px solid #fff;
            color: #000;
            font-weight: 900;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            cursor: pointer;
        }

        .discard-box {
            width: 85px;
            height: 120px;
            border-radius: 8px;
            border: 3px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            cursor: pointer;
            background: rgba(0,0,0,0.3);
        }

        /* Card Graphics */
        .card-face {
            width: 100%;
            height: 100%;
            background: #fff;
            color: #111;
            border-radius: 8px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-weight: bold;
            box-shadow: -2px 4px 8px rgba(0,0,0,0.4);
            position: relative;
        }
        .card-face.red { color: #d00000; }
        .card-val { font-size: 18px; line-height: 1; }
        .card-suit { font-size: 14px; line-height: 1; }
        .card-center-suit { font-size: 32px; text-align: center; position: absolute; top: 35%; left: 30%; }

        /* Player Bottom Section */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: -15px;
        }

        .hand-container {
            position: relative;
            height: 150px;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .hand-card {
            width: 80px;
            height: 118px;
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .hand-card:hover {
            transform: translateY(-20px) !important;
        }

        .bottom-left-btn, .bottom-right-btn {
            position: absolute;
            bottom: 20px;
        }
        .bottom-left-btn { left: 20px; }
        .bottom-right-btn { right: 20px; }
    </style>
</head>
<body>

    <div class="game-table">
        <!-- Top Info -->
        <div class="top-left-info">
            <div class="icon-btn">🔊</div>
            <div class="bet-box">
                <div>Total Bet</div>
                <div class="val">2.000</div>
            </div>
        </div>

        <div class="top-right-info">
            <div>To finish: <span>100</span></div>
            <div>To knock: <span>10</span></div>
        </div>

        <!-- Opponent Header -->
        <div class="opponent-area">
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar"><img src="https://via.placeholder.com/40" alt="Hilal"></div>
                <div>
                    <div style="font-size: 12px; font-weight: bold;">Hilal</div>
                    <div style="font-size: 11px; color: #ffd700;">🟡 127.000</div>
                </div>
            </div>
        </div>

        <!-- Center Area -->
        <div class="middle-area">
            <div class="deck-box" onclick="drawCard('deck')">
                <div class="title">GIN<br>rummy</div>
                <div class="count" id="deckCount">31</div>
            </div>

            <div class="pass-btn">PASS</div>

            <div class="discard-box" id="discardPile" onclick="drawCard('discard')">
                <!-- Discard Card Rendered Here -->
            </div>
        </div>

        <!-- Bottom Player Section -->
        <div class="bottom-section">
            <div class="player-badge">
                <div class="stat-group">
                    <div>Points</div>
                    <div class="val">0/100</div>
                </div>
                <div class="avatar" style="border-color: #ffd700;">
                    <img src="https://via.placeholder.com/40" alt="Player">
                </div>
                <div class="stat-group">
                    <div>Deadwood</div>
                    <div class="val">70/10</div>
                </div>
            </div>

            <!-- Player Hand -->
            <div class="hand-container" id="playerHand"></div>
        </div>

        <div class="icon-btn bottom-left-btn">🚪</div>
        <div class="icon-btn bottom-right-btn">🎴</div>
    </div>

    <script>
        const socket = io();
        let playerHand = [];

        socket.emit('startGinRummy');

        socket.on('gameInit', (data) => {
            playerHand = data.playerHand;
            document.getElementById('deckCount').innerText = data.deckCount;
            renderDiscard(data.topDiscard);
            renderHand();
        });

        function renderDiscard(card) {
            const container = document.getElementById('discardPile');
            if(!card) {
                container.innerHTML = '';
                return;
            }
            const isRed = card.suit === '♥' || card.suit === '♦';
            container.innerHTML = `
                <div class="card-face ${isRed ? 'red' : ''}">
                    <div>
                        <div class="card-val">${card.value}</div>
                        <div class="card-suit">${card.suit}</div>
                    </div>
                    <div class="card-center-suit">${card.suit}</div>
                    <div style="transform: rotate(180deg); align-self: flex-end;">
                        <div class="card-val">${card.value}</div>
                        <div class="card-suit">${card.suit}</div>
                    </div>
                </div>
            `;
        }

        function renderHand() {
            const container = document.getElementById('playerHand');
            container.innerHTML = '';
            const total = playerHand.length;

            playerHand.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'hand-card';

                // Fan Arc position logic
                const mid = (total - 1) / 2;
                const offset = index - mid;
                const angle = offset * 4; 
                const translateX = offset * 28;
                const translateY = Math.abs(offset) * 3;

                cardEl.style.transform = `translateX(${translateX}px) translateY(${translateY}px) rotate(${angle}deg)`;

                const isRed = card.suit === '♥' || card.suit === '♦';
                cardEl.innerHTML = `
                    <div class="card-face ${isRed ? 'red' : ''}">
                        <div>
                            <div class="card-val">${card.value}</div>
                            <div class="card-suit">${card.suit}</div>
                        </div>
                        <div class="card-center-suit">${card.suit}</div>
                        <div style="transform: rotate(180deg); align-self: flex-end;">
                            <div class="card-val">${card.value}</div>
                            <div class="card-suit">${card.suit}</div>
                        </div>
                    </div>
                `;

                cardEl.onclick = () => discardCard(index);
                container.appendChild(cardEl);
            });
        }

        function drawCard(source) {
            socket.emit('drawCard', source);
        }

        function discardCard(index) {
            if (playerHand.length > 10) {
                socket.emit('discardCard', index);
            }
        }

        socket.on('cardDrawn', (data) => {
            playerHand.push(data.card);
            document.getElementById('deckCount').innerText = data.deckCount;
            if(data.topDiscard) renderDiscard(data.topDiscard);
            renderHand();
        });

        socket.on('cardDiscarded', (data) => {
            playerHand = data.playerHand;
            renderDiscard(data.topDiscard);
            renderHand();
        });
    </script>
</body>
    </html>
